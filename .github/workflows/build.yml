name: Build APK
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: '8.14.3' }
      - run: gradle :app:assembleRelease --no-daemon
      - run: cp app/build/outputs/apk/release/app-release.apk NTGrego.apk
      - uses: actions/setup-dotnet@v4
        with: { dotnet-version: '8.0.x' }
      - name: Build Windows (exe único, sem instalar .NET)
        run: |
          dotnet publish windows/NTGrego.csproj -c Release -r win-x64 --self-contained true \
            -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true \
            -p:EnableCompressionInSingleFile=true -o winout
          cp winout/NTGrego.exe NTGrego.exe
      - uses: actions/upload-artifact@v4
        with:
          name: NTGrego
          path: |
            NTGrego.apk
            NTGrego.exe
      - name: Versão
        id: ver
        run: echo "v=v$(cat VERSION | tr -d '[:space:]')" >> "$GITHUB_OUTPUT"
      - name: Remover builds de teste antigos
        env: { GH_TOKEN: '${{ github.token }}' }
        run: |
          for t in v1.0.1 v1.0.2; do gh release delete "$t" --yes --cleanup-tag -R "$GITHUB_REPOSITORY" || true; done
      - name: Publicar release (atualiza o APK se a versão já existir)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.v }}
          target_commitish: ${{ github.sha }}
          name: NT Grego ${{ steps.ver.outputs.v }}
          files: |
            NTGrego.apk
            NTGrego.exe
          make_latest: true
          body: |
            Trecho do dia do NT em grego (SBLGNT) + leitor com TB e análise morfológica.
            - Android: NTGrego.apk
            - Windows 10/11 (64 bits): NTGrego.exe — não precisa instalar; basta executar.
